# Members
members:
  jonathan-dortheimer:
    name: "Jonathan Dortheimer"
    description: "Head of Lab"
    bio: |
      Jonathan Dortheimer is an architect, educator, researcher, and founder of the Architectural Artificial Intelligence Research Lab at Ariel University. His work examines how artificial intelligence, computational methods, and participatory technologies can support architectural design, urban planning, and more transparent decision-making.

      Jonathan is a senior lecturer at the [Ariel University School of Architecture](https://www.ariel.ac.il/wp/architecture/en/) and a guest scholar at the [Chair of Architectural Informatics, Technical University of Munich](https://www.arc.ed.tum.de/ai/team/jonathan-dortheimer/) in Germany.

      He completed his doctoral studies in 2021 at Tel Aviv University under the supervision of Prof. [Eran Neuman](https://english.tau.ac.il/profile/eneuman) and Prof. [Tova Milo](https://english.tau.ac.il/profile/milo). He later worked as a postdoctoral researcher at the Material Topology Research Lab at the Technion, in collaboration with the Future Automation Lab at Cornell Tech, under the supervision of Prof. [Aaron Sprecher](https://architecture.technion.ac.il/members/aaron-sprecher/) and Prof. [Wendy Ju](https://tech.cornell.edu/people/wendy-ju/).

      Jonathan's research develops and evaluates computational tools for participatory design, urban AI, and urban digital twins. Across these areas, his work asks how AI can meaningfully support architectural and planning practice without displacing professional responsibility, public deliberation, or local knowledge.

      Alongside his academic work, Jonathan has founded several technology initiatives and co-founded [Meirim](https://meirim.org/), a platform promoting democratic participation in urban planning in Israel.
  haya-brama:
    name: "Haya Brama"
    bio: |
      Dr. Haya Brama is a researcher and lab manager at AAIRL, specializing in deep learning, machine learning, and AI applications for architectural and urban systems.

      She completed her Ph.D. in neuroscience at Bar-Ilan University, where she studied biological neural networks using population-dynamics modeling and in-vivo electrophysiological recordings. Her postdoctoral research at Ariel University's Department of Industrial Engineering and Management extended this computational foundation to artificial neural networks, cybersecurity applications, and metaheuristic search.

      From 2000 to 2023, Haya served as Chief Scientific Officer at ARK, a startup developing AI-based tools for automated architectural design. This trajectory — from systems neuroscience to applied machine learning in the built environment — informs her current work connecting rigorous computational modeling with practical planning and design problems.
  orly-moas-cohen:
    name: "Orly Moas-Cohen"
    bio: |
      Orly Moas-Cohen is an architect, urban planner, and Ph.D. researcher at AAIRL. She brings extensive experience in complex planning processes, urban and industrial renewal, heritage preservation, public service, management, and strategic consulting.

      She holds an M.Arch. from the Technion and a B.Arch. from Ariel University. Over two decades of professional practice, Orly has led planning teams, advanced large-scale urban projects, and served on planning committees, including national and district-level committees in Israel.

      Orly teaches architecture at Ariel University and lectures on architecture, urban renewal, heritage preservation, and strategic planning. Her research connects professional planning knowledge with the lab's interest in resilient, socially aware, and evidence-based urban development.

      Across her work, Orly emphasizes human-centered planning, urban quality of life, and the long-term social and environmental consequences of planning decisions.
  shay-skital:
    name: "Shay Skital"
    bio: |
      Shay Skital, an architect and urban planner, holds a B.Arch. from Ariel University and an M.A. in Urban-Environmental Design from Tel Aviv University.

      During his service in senior public-sector roles, Shay served as City Architect and Head of the Planning Department in several local authorities. In these roles, he worked on a wide range of subjects, including: managing planning processes, planning new neighborhoods, preserving historic buildings and areas, urban renewal, planning commercial and employment zones, tourism-oriented planning, and planning public buildings and public spaces in the city.

      In his work, Shay places a central emphasis on urban planning that connects to place and its surroundings, through an in-depth examination of the character of the local authority, improving the urban experience, and what the city can offer those within it.
  hila-david:
    name: "Hila David"
    bio: |
      Hila David is an architect and master's student at AAIRL. She completed her bachelor's degree at Ariel University, where her final project received the Azrieli Prize for Outstanding Final Projects.

      Before joining the lab, Hila worked as an architect on urban planning, public buildings, and residential projects. Her research focuses on visual architectural communication, including diagrams, representation types, and their role in human-AI interaction for design.
  adiya-karmon:
    name: "Adiya Karmon"
    bio: |
      Adiya Karmon is an architecture student at Ariel University and a master's student in sustainable architecture. Her research at AAIRL explores parametric urban planning as a method for supporting more informed and environmentally responsive city planning.

      Her work connects architectural design, computational methods, and sustainable urban development, with an emphasis on how planning tools can help evaluate alternatives and improve the quality of the built environment.
  bnaya-unger:
    name: "Bnaya Unger"
    bio: |
      Bnaya Unger is a B.Sc. student in Industrial Engineering and Management and an honors-track M.Sc. student in Industrial Engineering and Management. His research at AAIRL focuses on urban renewal decision support.

      As part of a collaborative project with Green Group, Bnaya studies parcel aggregation for urban renewal. His work applies machine learning and deep learning methods to identify promising parcel combinations and support more transparent, evidence-based planning decisions.
  elior-dahan:
    name: "Elior Dahan"
    bio: |
      Elior Dahan is a B.Sc. student in Industrial Engineering and Management and an honors-track M.Sc. student in Industrial Engineering and Management. His work at AAIRL contributes to the lab's Urban Digital Twin research.

      Elior studies how urban data, computational models, and AI-based analysis can support more transparent and evidence-based planning processes. His work is connected to the lab's effort to develop interoperable digital infrastructure for urban simulation, decision support, and model evaluation.
  gaya-bitman:
    name: "Gaya Bitman"
    bio: |
      Gaya Bitman is an architecture student at the Ariel School of Architecture and a master's student at AAIRL. Her research explores computational design methods for architectural problems shaped by cultural, religious, and spatial constraints.

      Her current work studies the use of genetic algorithms in the design of religious architecture. The research connects rule-based design, optimization, and architectural reasoning, showing how computational methods can help designers explore constrained design spaces more systematically.
  michael-sharon:
    name: "Michael Sharon"
    bio: |
      Michael Sharon is an architecture student at the Ariel School of Architecture and a research assistant at AAIRL. His work explores advanced computational methods for architectural design.

      As part of the METROPOLIS project, Michael examines how natural-language-based design interfaces can be used to control the planning of urban scenarios on digital twin platforms.
  maya-milovidov:
    name: "Maya Milovidov"
    bio: |
      Maya Milovidov is a Dean's List student at the Ariel School of Architecture at Ariel University and a research assistant at the AAIRL lab.

      Her professional and research work focuses on integrating artificial intelligence into the physical world. As part of this, Maya is a partner in the research project "Physical AI: A Living Lab in a Building," which examines how smart buildings, robots, and humans can communicate and act together safely and efficiently, with the goal of improving quality of life for everyone.
  libby-orlov:
    name: "Libby Orlov"
    bio: |
      Libby Orlov is an architecture student at the Ariel School of Architecture and a research assistant at AAIRL. Her work focuses on decision-making in urban renewal, integrating tools from the field of behavioral economics.

      Libby's research aims to identify existing cognitive biases and barriers that influence property owners during urban renewal decision-making processes, with the goal of characterizing them to significantly streamline decision-making and advance future urban renewal projects.
  neta-ben-david:
    name: "Neta Ben David"
    bio: |
      Neta Ben David is an architecture student at the Ariel School of Architecture and a research assistant at AAIRL. Her work focuses on the intersection of architectural design, AI, and human experience in built environments.

      Neta's research explores how artificial intelligence can predict human emotional responses to the built environment, helping designers evaluate buildings and urban spaces beyond conventional performance metrics. Her work contributes to the lab's research directions in Synthetic Humans and Design AI.
  ofir-glassman:
    name: "Ofir Glassman"
    bio: |
      Ofir Glassman is an architecture student at the Ariel School of Architecture and a research assistant at AAIRL. Her work focuses on the intersection of architectural design, AI, and human experience in built environments.

      Ofir's research studies how AI can approximate aspects of human behavior and spatial response, helping designers evaluate built environments beyond conventional performance metrics. Her work contributes to the lab's Synthetic Humans and Design AI research directions.
  gal-gendler:
    name: "Gal Gendler"
    bio: |
      Gal Gendler is a multidisciplinary researcher with expertise in software engineering, public policy, and city planning. She holds a B.Sc. in Computer Science, an M.A. in Public Policy, and an M.Sc. with distinction from UCL in Transport and City Planning.

      Before joining AAIRL, Gal worked in the technology sector as a software engineer, specializing in geographic information systems, big data, and transport planning. This background informs her research on urban AI platforms, spatial data infrastructure, and planning decision-support systems.

      Gal's work at AAIRL focused on urban renewal policy and the development of an urban AI platform for hosting machine-learning models for the built environment. Her research contributed to the lab's broader effort to make urban analytics more interoperable, transparent, and useful for planning practice.
  gal-guz:
    name: "Gal Guz"
    bio: |
      Gal Guz is a UX/UI designer and alumnus of AAIRL, where he was an architecture student. His work combines architectural design, interface design, and software development for complex research systems.

      At AAIRL, Gal contributed to projects on AI-supported architectural evaluation and urban planning decision support. His work included interface design for systems that predict social impacts of urban renewal and research on whether AI tools can approximate human responses to built spaces.

      Gal's design practice spans user requirements, operational concept development, prototyping, user testing, design systems, and development handoff. He works primarily with the React ecosystem and 3D web technologies such as Three.js.
  ela-moyal:
    name: "Ela Moyal"
    bio: |
      Ela Moyal is an architect and alumna of AAIRL. Her research examined urban renewal policy in Israel, focusing on facade renovation programs in Tel Aviv and their implications for urban design, housing quality, and the lived experience of residents.

      Her work contributed to the lab's urban studies research, which investigates how planning policies and development mechanisms shape built environments and communities.
  gilad-chalfon:
    name: "Gilad Chalfon"
    bio: |
      Gilad Chalfon is an architect and alumnus of AAIRL. His research examined the political and social implications of smart city applications, with a focus on how parking technologies function as instruments of privatization and governance in Israeli cities.

      His work contributed to the lab's critical urban studies research, which investigates the power relations and institutional responsibilities embedded in digital systems for cities.
  lielle-brenner:
    name: "Lielle Brenner"
    bio: |
      Lielle Brenner is an alumna of AAIRL. Her work contributed to the lab's Design AI research, which studies how AI can support architectural creativity, design communication, and empirical evaluation of built environments.
  atakilti-brhanu-kiros:
    name: "Atakilti Brhanu Kiros"
    research_focus: |
      Atakilti Brhanu Kiros is a PhD researcher in Civil Engineering at Ariel University, specialising in GeoAI, geospatial data science, and intelligent mobility systems. His research examines how multimodal urban data, machine learning, Earth observation, and urban digital twins can support pedestrian-mobility forecasting, accessibility analysis, and evidence-based urban planning. Atakilti contributes to the METROPOLIS Urban Digital Twin project at the Architectural Artificial Intelligence Research Lab.
    current_work: |
      His doctoral research focuses on developing transferable and explainable GeoAI models to predict pedestrian activity across cities with diverse urban structures, climates, sensor networks, and levels of data availability. His work integrates pedestrian sensor observations with urban morphology, transportation networks, accessibility, socioeconomic indicators, weather, remote sensing, and other geospatial information. His work also explores scenario-based pedestrian forecasting under urban growth and climate change conditions, as well as the development of interpretable digital tools for researchers, urban planners, municipalities, and decision-makers.
    background: |
      Before beginning his doctoral studies, Atakilti worked as a lecturer, researcher, and academic leader in computer science and information technology in Mekelle University, Ethiopia.
    interests: |
      His broader interests include spatiotemporal machine learning, explainable AI, multimodal geospatial data fusion, inclusive mobility, and responsible urban artificial intelligence.
  stasis-mukwenya:
    name: "Stasis Mukwenya"
    research_focus: |
      Stasis Mukwenya is a PhD researcher in Civil Engineering at Ariel University, specializing in urban geospatial data science, semantic interoperability, and human-centric urban digital twins. His research examines how urban domain models that are built and run separately, for energy, climate, mobility, and urban form, can share meaning rather than only data, and predict more accurately as a result. Stasis contributes to the METROPOLIS Urban Digital Twin project at the Architectural Artificial Intelligence Research Lab, a platform on which planners run simulations against a shared model of a city, test proposed developments as separate scenarios, and compare the outcomes before any decision is committed.
    current_work: |
      His doctoral research develops ontologies for cognitive urban digital twins, shared semantic structures through which independently built models exchange typed, physically grounded information at inference time without retraining. The work introduces measures of how complete such a shared language is, separating what a twin can name from what it can relate, and tests them on pedestrian flow prediction under both routine and extreme urban conditions, where models that rely only on historical trends are least reliable. He also works on the infrastructure beneath this: how city data is stored and organised, how simulation models are supplied with what they need, and how new data sources and models are added without the system being rebuilt.
    background: |
      Before beginning his doctoral studies, Stasis earned a BSc in Electronics and Telecommunications Engineering and an MSc in Mechatronics and Artificial Intelligence.
    interests: |
      His broader interests include knowledge representation, physics-informed machine learning, cross-domain reasoning, inclusive mobility, and responsible urban artificial intelligence.
  yaswanth-alla:
    name: "Yaswanth Alla"
    research_focus: |
      Yaswanth Alla is a Ph.D. student at the AAIRL, applying his expertise in Generative AI and immersive technologies to current research on visual chatbots and synthetic humans.
    current_work: |
      His work aims to enhance how users interact with complex simulated environments, directly contributing to the lab's broader mission of exploring AI-driven architectural design, urban renewal, and human-centric spatial development.
    background: |
      He holds an M.Sc. in Computer Science from Wright State University, a Post Graduate Diploma in Artificial Intelligence and Machine Learning from the National Institute of Technology (NIT) Warangal, and a B.Tech. in Electronics and Communication Engineering from JNTUK. Before joining the lab, Yaswanth developed intelligent and interactive systems as a Developer at Tata Consultancy Services (TCS), working across multiple domains of AI and spatial computing.
  doron-greenberg:
    name: "Doron Greenberg"
    bio: |
      Dr. Doron Greenberg holds a Ph.D. in Economics from the University of Houston. He previously served as a Senior Lecturer in the Department of Economics and Business Administration at Ariel University, where he continues his work today as a Research Fellow. An experienced educator in economics and finance, he has published dozens of academic papers alongside public commentary on personal finance and public wealth in local media.

      His primary research focuses on behavioral economics and finance. He was appointed the founding director of the Israeli college chapter of the Global Association of Risk Professionals (GARP) at Ariel University. Since 2024, his research at AAIRL has focused on the behavioral economic aspects of urban renewal.

jobs:
  phd:
    title: "Ph.D. Studies"
    intro: "We welcome Ph.D. candidates eager to pursue rigorous research at the intersection of AI and architectural or urban-planning practice — research grounded in real-world constraints and developed together with municipal and industry partners."
    about:
      - "Shape a research agenda around a real planning or design problem"
      - "Develop methods and tools, and validate them empirically"
      - "Work with real-world data, often alongside partner feedback"
      - "Publish throughout the Ph.D., frequently as first author"
      - "Contribute to lab infrastructure where relevant (datasets, benchmarks, tools)"
      - "Fully funded, project-based position"
    look:
      - "Strong motivation for research and writing"
      - "Quantitative or computational skills (machine learning, statistics, simulation, optimization — any combination works)"
      - "Ability to work independently while collaborating closely with the group"
      - "Backgrounds welcome from architecture, computer science, engineering, urban studies, and related fields"
    body: |
      **Our lab offers project-funded Ph.D. positions.** To express interest, email [Dr. Haya Brama](mailto:hayab@ariel.ac.il) with the subject line "Ph.D. inquiry" and include:

      * CV
      * Transcripts
      * A short paragraph describing your interests and relevant experience
      * (Optional) A writing sample, portfolio, GitHub profile, or previous thesis

      More details are available on Ariel University's [Ph.D. website](https://www.ariel.ac.il/wp/graduate-school/en/applicants/).
  master:
    title: "Master's Thesis Track"
    intro: "We accept M.Sc. students exclusively through the thesis track — best suited to students considering a Ph.D. or seeking serious research training. In the lab, students work hands-on with real datasets and research questions tied to ongoing projects and partners."
    about:
      - "Build research skills, a strong portfolio, and a realistic view of academic and applied research"
      - "Complete an original research project"
      - "Develop methods and tools, and validate them empirically"
      - "Write a thesis with a clear, well-defined contribution"
      - "Often submit findings to a conference or journal"
    look:
      - "Strong motivation for research and writing"
      - "Interest in computational, empirical, or design-oriented research"
      - "Ability to work independently while receiving close supervision"
      - "Relevant skills in design, planning, data analysis, programming, or spatial tools"
      - "Availability for sustained thesis work within an ongoing lab project"
    body: |
      Email [Dr. Haya Brama](mailto:hayab@ariel.ac.il) with your CV and transcripts, subject line "Master's Thesis Application."
      In the body of your email, include:

      * Your degree program and year
      * A short description of your interests (2–3 topics)
      * Relevant skills (software, tools, coursework) and your weekly availability

      More details are available on Ariel University's [M.Sc. in Architecture website](https://www.ariel.ac.il/wp/architecture/m-d/).
  postdoc:
    title: "Postdoctoral Fellows"
    intro: "We welcome applicants from a wide range of backgrounds — architecture, design, geography, urban planning, and beyond — not only those with a strong quantitative or computational background. What matters most is curiosity, rigor, and a genuine interest in high-impact work in urban AI, computational design, spatial analytics, or data-driven planning."
    about:
      - "Shape a research agenda around a real planning or design problem"
      - "Develop methods and tools, and validate them empirically"
      - "Work with real-world data, often alongside partner feedback"
      - "Publish in high-quality journals and conferences"
      - "Contribute to lab infrastructure where relevant (datasets, benchmarks, tools)"
      - "Fully funded, project-based position"
    look:
      - "Urban AI and machine learning for design and planning decision support"
      - "Human–AI interaction for design tools"
      - "Spatial analytics, simulation, and benchmarking"
      - "Applied research with public and private partners"
    body: |
      **Our lab offers project-funded postdoctoral positions.** To apply, send a single PDF document (max. 10MB) to [Dr. Haya Brama](mailto:hayab@ariel.ac.il) with the subject line "Postdoctoral application." The PDF should include:

      * CV
      * A cover letter describing your research interests and fit with AAIRL
      * Up to 3 publications or work samples

      More details are available on Ariel University's [postdoc website](https://www.ariel.ac.il/wp/postdocs/).
