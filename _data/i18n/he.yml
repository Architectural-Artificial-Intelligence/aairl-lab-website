# Members
members:
  jonathan-dortheimer:
    name: "יונתן דורטהיימר"
    description: "ראש המעבדה"
    bio: |
      יונתן דורטהיימר הוא אדריכל, מחנך וחוקר, ומייסד AAIRL — מעבדת המחקר לבינה מלאכותית בארכיטקטורה באוניברסיטת אריאל. הוא בוחן כיצד בינה מלאכותית, שיטות חישוביות וטכנולוגיות השתתפותיות יכולות לתמוך בעיצוב אדריכלי, תכנון עירוני וקבלת החלטות שקופה יותר.

      יונתן הוא מרצה בכיר ב[בית הספר לארכיטקטורה של אוניברסיטת אריאל](https://www.ariel.ac.il/wp/architecture/) וחוקר אורח ב[קתדרה לאינפורמטיקה אדריכלית של האוניברסיטה הטכנית של מינכן](https://www.arc.ed.tum.de/ai/team/jonathan-dortheimer/), בגרמניה.

      הוא סיים דוקטורט ב-2021 באוניברסיטת תל אביב בהנחיית פרופ' [ערן נוימן](https://english.tau.ac.il/profile/eneuman) ופרופ' [טובה מילו](https://english.tau.ac.il/profile/milo), ולאחר מכן עבד כחוקר פוסט-דוקטורט במעבדת MTRL בטכניון, בשיתוף עם Future Automation Lab ב-Cornell Tech, בהנחיית פרופ' [אהרון שפרכר](https://architecture.technion.ac.il/members/aaron-sprecher/) ופרופ' [וונדי ג'ו](https://tech.cornell.edu/people/wendy-ju/).

      המחקר שלו מפתח ומעריך כלים חישוביים לעיצוב השתתפותי, AI עירוני ותאומים דיגיטליים עירוניים. הוא שואל כיצד AI יכול לתמוך בפרקטיקה אדריכלית ותכנונית מבלי לפגוע באחריות מקצועית, דיון ציבורי או ידע מקומי.

      לצד עבודתו האקדמית, יונתן ייסד מספר יוזמות טכנולוגיות והוא שותף-מייסד של [מעירים](https://meirim.org/), פלטפורמה לקידום השתתפות דמוקרטית בתכנון עירוני בישראל.

  haya-brama:
    name: "חיה ברמה"
    bio: |
      ד"ר חיה ברמה היא חוקרת ומנהלת מעבדה ב-AAIRL, עם התמחות בלמידה עמוקה, למידת מכונה ויישומי AI למערכות אדריכלות ועירוניות.

      היא סיימה דוקטורט בנוירוביולוגיה באוניברסיטת בר-אילן, שם חקרה רשתות עצביות ביולוגיות באמצעות מודלינג דינמיקת אוכלוסיות והקלטות אלקטרופיזיולוגיות in vivo. המחקר הפוסט-דוקטורי שלה באוניברסיטת אריאל הרחיב בסיס חישובי זה לרשתות עצביות מלאכותיות, יישומי אבטחת סייבר וחיפוש מטא-הוריסטי.

      בין השנים 2000–2023 שימשה חיה כמדענית ראשית ב-ARK, סטארטאפ שפיתח כלים מבוססי AI לעיצוב אדריכלי אוטומטי. מסלול זה — מנוירוביולוגיה מערכתית ללמידת מכונה יישומית בסביבה הבנויה — מעצב את עבודתה הנוכחית, המחברת מודלינג חישובי מחמיר עם בעיות תכנון ועיצוב מהעולם האמיתי.
  orly-moas-cohen:
    name: "אורלי מואס-כהן"
    bio: |
      אורלי מואס-כהן היא אדריכלית, מתכננת עירונית וחוקרת דוקטורט ב-AAIRL. יש לה ניסיון נרחב בתהליכי תכנון מורכבים, התחדשות עירונית ותעשייתית, שימור מורשת, שירות ציבורי, ניהול וייעוץ אסטרטגי.

      היא בעלת תואר M.Arch מהטכניון ותואר B.Arch מאוניברסיטת אריאל. במהלך יותר משני עשורים של עבודה מקצועית הובילה אורלי צוותי תכנון, קידמה פרויקטים עירוניים רחבי-היקף וכיהנה בוועדות תכנון, כולל ועדות ברמה ארצית ומחוזית בישראל.

      אורלי מלמדת אדריכלות באוניברסיטת אריאל ומרצה על אדריכלות, התחדשות עירונית, שימור מורשת ותכנון אסטרטגי. המחקר שלה מחבר בין ידע תכנוני מקצועי לבין העניין של המעבדה בפיתוח עירוני עמיד, מודע-חברתית ומבוסס-ראיות.

      לאורך עבודתה, אורלי מדגישה תכנון ממוקד-אדם, איכות חיים עירונית וההשלכות החברתיות והסביבתיות ארוכות-הטווח של החלטות תכנון.
  shay-skital:
    name: "שי סקיטל"
    bio: |
      שי סקיטל, אדריכל ומתכנן ערים, הוא בוגר תואר ראשון בארכיטקטורה (B.Arch.) מאוניברסיטת אריאל, ובעל תואר שני בעיצוב עירוני-סביבתי (M.A.) מאוניברסיטת תל אביב.

      במהלך שירותו בתפקידים בכירים במגזר הציבורי, שי כיהן כאדריכל עיר וכראש אגף תכנון במספר רשויות מקומיות. במסגרת תפקידיו אלה, הוא עסק במגוון רחב של נושאים, ביניהם: ניהול תהליכי תכנון, תכנון שכונות חדשות, שימור מבנים ואזורים היסטוריים, התחדשות עירונית, תכנון אזורי תעסוקה ומסחר, תכנון בראייה תיירותית, תכנון מבני ציבור ומרחבים ציבוריים בעיר.

      בעבודתו, שם שי דגש מרכזי על תכנון עירוני בראיית חיבור למקום וסביבתו, תוך בחינה מעמיקה של אופי הרשות המקומית, שיפור החוויה העירונית ומה העיר יכולה להעניק לנמצאים בה.
  hila-david:
    name: "הילה דוד"
    bio: |
      הילה דוד היא אדריכלית וסטודנטית לתואר שני ב-AAIRL. היא סיימה תואר ראשון באוניברסיטת אריאל, שם פרויקט הגמר שלה זכה בפרס אזריאלי לפרויקטי גמר מצטיינים.

      לפני שהצטרפה למעבדה עבדה הילה כאדריכלית בתכנון עירוני, מבני ציבור ופרויקטי מגורים. המחקר שלה עוסק בתקשורת אדריכלית חזותית — דיאגרמות, סוגי ייצוג, ותפקידם באינטראקציה בין אדם ל-AI בעיצוב.
  adiya-karmon:
    name: "עדיה כרמון"
    bio: |
      עדיה כרמון היא סטודנטית לאדריכלות באוניברסיטת אריאל ולתואר שני בארכיטקטורה בת-קיימא. המחקר שלה ב-AAIRL בוחן תכנון עירוני פרמטרי ככלי לתכנון עיר חכם וסביבתי יותר.

      היא מחברת עיצוב אדריכלי, שיטות חישוביות ופיתוח עירוני בר-קיימא — עם דגש על כיצד כלי תכנון יכולים לעזור להעריך חלופות ולשפר את איכות הסביבה הבנויה.
  bnaya-unger:
    name: "בניה אונגר"
    bio: |
      בניה אונגר הוא סטודנט לתואר ראשון בהנדסת תעשייה וניהול ולתואר שני במסלול מצוינות בהנדסת תעשייה וניהול. המחקר שלו ב-AAIRL עוסק בתמיכת החלטות בהתחדשות עירונית.

      כחלק מפרויקט משותף עם גרין גרופ, בניה חוקר צבירת חלקות להתחדשות עירונית. הוא מיישם שיטות למידת מכונה ולמידה עמוקה לזיהוי שילובי חלקות מבטיחים ולתמיכה בהחלטות תכנוניות שקופות ומבוססות-ראיות.
  elior-dahan:
    name: "אליאור דהן"
    bio: |
      אליאור דהן הוא סטודנט לתואר ראשון בהנדסת תעשייה וניהול ולתואר שני במסלול מצוינות בהנדסת תעשייה וניהול. עבודתו ב-AAIRL תורמת למחקר התאום הדיגיטלי העירוני של המעבדה.

      אליאור חוקר כיצד נתוני עיר, מודלים חישוביים וניתוח מבוסס-AI יכולים לתמוך בתהליכי תכנון שקופים ומבוססי-ראיות. עבודתו קשורה למאמץ של המעבדה לפתח תשתית דיגיטלית אינטרופרבילית לסימולציה עירונית, תמיכה בקבלת החלטות והערכת מודלים.
  gaya-bitman:
    name: "גאיה ביטמן"
    bio: |
      גאיה ביטמן היא סטודנטית לאדריכלות בבית הספר לארכיטקטורה של אריאל ולתואר שני ב-AAIRL. המחקר שלה עוסק בשיטות עיצוב חישובי לבעיות אדריכלות שמעוצבות על ידי אילוצים תרבותיים, דתיים ומרחביים.

      העבודה הנוכחית שלה בוחנת שימוש באלגוריתמים גנטיים בעיצוב אדריכלות דתית. המחקר מחבר בין עיצוב מבוסס-כללים, אופטימיזציה והיגיון אדריכלי, ומראה כיצד שיטות חישוביות יכולות לעזור למעצבים לחקור מרחבי עיצוב מוגבלים בצורה שיטתית יותר.
  michael-sharon:
    name: "מיכאל שרון"
    bio: |
      מיכאל שרון הוא סטודנט לאדריכלות בבית הספר לארכיטקטורה של אריאל ועוזר מחקר ב-AAIRL. עבודתו בוחנת שיטות חישוביות מתקדמות לעיצוב אדריכלי.

      במסגרת פרויקט METROPOLIS, מיכאל בוחן כיצד ניתן להשתמש בממשקי עיצוב מבוססי שפה טבעית כדי לשלוט בתכנון תרחישים עירוניים בפלטפורמות של תאומים דיגיטליים.
  maya-milovidov:
    name: "מאיה מילובידוב"
    bio: |
      מאיה מילובידוב היא סטודנטית מצטיינת דקאן בבית הספר לארכיטקטורה באוניברסיטת אריאל ועוזרת מחקר במעבדת AAIRL.

      עשייתה המקצועית והמחקרית מתמקדת בשילוב בינה מלאכותית בעולם הפיזי. במסגרת זו, מאיה שותפה במחקר "בינה מלאכותית פיזיקלית: מעבדה חיה בבניין", הבוחן כיצד בניינים חכמים, רובוטים ובני אדם יכולים לתקשר ולפעול יחד בצורה בטוחה ויעילה במטרה לשפר את איכות החיים של כולנו.
  libby-orlov:
    name: "ליבי אורלוב"
    bio: |
      ליבי אורלוב היא סטודנטית לאדריכלות בבית הספר לארכיטקטורה של אריאל ועוזרת מחקר ב-AAIRL. עבודתה עוסקת בנושא קבלת החלטות במסגרת התחדשות עירונית, תוך שילוב כלים מעולם הכלכלה ההתנהגותית.

      המחקר של ליבי מבקש לזהות הטיות קוגניטיביות וחסמים קיימים המשפיעים על בעלי הנכסים בעת קבלת החלטות במסגרת התחדשות עירונית, במטרה לאפיין אותם ובכך להקל משמעותית על תהליך קבלת ההחלטות ועל קידומם של פרויקטי התחדשות עירונית בעתיד.
  neta-ben-david:
    name: "נטע בן דוד"
    bio: |
      נטע בן דוד היא סטודנטית לאדריכלות בבית הספר לארכיטקטורה של אריאל ועוזרת מחקר ב-AAIRL. עבודתה עוסקת בצומת שבין עיצוב אדריכלי, AI וחוויה אנושית בסביבות בנויות.

      המחקר של נטע בוחן כיצד בינה מלאכותית יכולה לחזות תגובות רגשיות אנושיות לסביבה הבנויה, ובכך לעזור למעצבים להעריך בניינים ומרחבים עירוניים מעבר למדדי ביצוע מקובלים. עבודתה תורמת לכיווני המחקר "אנשים סינתטיים" ו"עיצוב AI" של המעבדה.
  ofir-glassman:
    name: "אופיר גלסמן"
    bio: |
      עפרי גלסמן היא סטודנטית לאדריכלות בבית הספר לארכיטקטורה של אריאל ועוזרת מחקר ב-AAIRL. עבודתה עוסקת בצומת שבין עיצוב אדריכלי, AI וחוויה אנושית בסביבות בנויות.

      המחקר של עפרי בוחן כיצד AI יכול לקרב היבטים של התנהגות אנושית ותגובה מרחבית, ובכך לעזור למעצבים להעריך סביבות בנויות מעבר למדדי ביצוע מקובלים. עבודתה תורמת לכיווני המחקר "אנשים סינתטיים" ו"עיצוב AI" של המעבדה.
  gal-gendler:
    name: "גל גנדלר"
    bio: |
      גל גנדלר היא חוקרת רב-תחומית עם מומחיות בהנדסת תוכנה, מדיניות ציבורית ותכנון ערים. היא בעלת תואר ראשון במדעי המחשב, תואר שני במדיניות ציבורית ותואר שני בהצטיינות מ-UCL בתחבורה ותכנון עיר.

      לפני הצטרפותה ל-AAIRL עבדה גל בתעשיית ההייטק כמהנדסת תוכנה, בהתמחות במערכות מידע גאוגרפיות, ביג דאטה ותכנון תחבורה. הרקע הזה מעצב את מחקרה בנושא פלטפורמות AI עירוניות, תשתיות נתונים מרחביים ומערכות תמיכה בהחלטות תכנון.

      עבודתה של גל ב-AAIRL התמקדה במדיניות התחדשות עירונית ובפיתוח פלטפורמת AI עירונית לאחסון מודלי למידת מכונה לסביבה הבנויה. מחקרה תרמה למאמץ הרחב יותר של המעבדה להפוך את האנליטיקה העירונית לאינטרופרבילית, שקופה ושימושית יותר לפרקטיקת התכנון.
  gal-guz:
    name: "גל גוז"
    bio: |
      גל גוז הוא מעצב UX/UI ובוגר AAIRL, שם היה סטודנט לאדריכלות. הוא משלב עיצוב אדריכלי, עיצוב ממשקים ופיתוח תוכנה למערכות מחקר מורכבות.

      ב-AAIRL תרם גל לפרויקטים בהערכה אדריכלית נתמכת-AI ותמיכת החלטות בתכנון עירוני. עבודתו כללה עיצוב ממשקים למערכות המנבאות השפעות חברתיות של התחדשות עירונית, וכן מחקר על השאלה האם כלי AI יכולים לקרב תגובות אנושיות לסביבות בנויות.

      פרקטיקת העיצוב של גל משתרעת על פני איסוף דרישות משתמש, פיתוח קונספט תפעולי, בניית אבות-טיפוס, בדיקות משתמשים, מערכות עיצוב והעברה לפיתוח. הוא עובד בעיקר עם מערכת האקולוגית של React וטכנולוגיות תלת-ממד לרשת כגון Three.js.
  ela-moyal:
    name: "אלה מויאל"
    bio: |
      אלה מויאל היא אדריכלית ובוגרת AAIRL. המחקר שלה עסק במדיניות התחדשות עירונית בישראל, עם התמקדות בתוכניות שיפוץ חזיתות בתל אביב והשלכותיהן על עיצוב עירוני, איכות דיור וחוויית החיים של התושבים.

      עבודתה תרמה למחקר העירוני של המעבדה, הבוחן כיצד מדיניות תכנון ומנגנוני פיתוח מעצבים סביבות בנויות וקהילות.
  gilad-chalfon:
    name: "גלעד חלפון"
    bio: |
      גלעד חלפון הוא אדריכל ובוגר AAIRL. המחקר שלו בחן את ההשלכות הפוליטיות והחברתיות של יישומי עיר חכמה, עם התמקדות בכיצד טכנולוגיות חניה מתפקדות ככלים של הפרטה וממשל בערים ישראליות.

      עבודתו תרמה למחקר העירוני הביקורתי של המעבדה, הבוחן את יחסי הכוח והאחריות המוסדית המוטמעים במערכות דיגיטליות לערים.
  lielle-brenner:
    name: "ליאל ברנר"
    bio: |
      ליאל ברנר היא בוגרת AAIRL. עבודתה תרמה למחקר Design AI של המעבדה, שבוחן כיצד AI יכול לתמוך ביצירתיות אדריכלית, תקשורת עיצובית והערכה אמפירית של סביבות בנויות.
  yaswanth-alla:
    name: "יסוואנת' אלה"
    bio: |
      יסוואנת' אלה הוא דוקטורנט ב-AAIRL. הוא בעל תואר שני במדעי המחשב מאוניברסיטת Wright State, דיפלומת המשך בבינה מלאכותית ולמידת מכונה מהמכון הלאומי לטכנולוגיה (NIT) בוורנגל, ותואר ראשון בהנדסת אלקטרוניקה ותקשורת מ-JNTUK.

      לפני הצטרפותו למעבדה, פיתח יסוואנת' מערכות אינטליגנטיות ואינטראקטיביות כמפתח בחברת Tata Consultancy Services (TCS). פרויקטיו הקודמים משתרעים על פני תחומים רבים של AI ומחשוב מרחבי. הוא פיתח צינור ראייה ממוחשבת מותאם להחדרת פרסומות במציאות רבודה בזמן אמת בזרמי וידאו, ובנה את "Vibe" — סוכן אוטונומי שנועד לנווט ולהפעיל אפליקציות אנדרואיד תוך חיקוי התנהגות אנושית. בנוסף, תרם ל-"Xperi", תוך שימוש ב-AI ומחשוב מבוזר כדי לספק חוויות מציאות רבודה מבוססות דפדפן לחינוך, ושילב מודלי שפה גדולים עם Unity XR ליצירת עולמות וירטואליים הניתנים להתאמה אישית ואווטארים חכמים של NPC ללא עצי התנהגות מתוסרטים מראש.

      ב-AAIRL, יסוואנת' מיישם את המומחיות שלו ב-AI גנרטיבי וטכנולוגיות אימרסיביות במחקרו הנוכחי על צ'אטבוטים חזותיים ובני אדם סינתטיים. עבודתו שואפת לשפר את האופן שבו משתמשים מתקשרים עם סביבות מדומות מורכבות, ותורמת ישירות לשליחות הרחבה יותר של המעבדה לחקור עיצוב אדריכלי מונחה-AI, התחדשות עירונית ופיתוח מרחבי ממוקד-אדם.
    research_focus: |
      יסוואנת' אלה הוא דוקטורנט ב-AAIRL, המיישם את המומחיות שלו ב-AI גנרטיבי וטכנולוגיות אימרסיביות במחקרו הנוכחי על צ'אטבוטים חזותיים ובני אדם סינתטיים.
    current_work: |
      עבודתו שואפת לשפר את האופן שבו משתמשים מתקשרים עם סביבות מדומות מורכבות, ותורמת ישירות לשליחות הרחבה יותר של המעבדה לחקור עיצוב אדריכלי מונחה-AI, התחדשות עירונית ופיתוח מרחבי ממוקד-אדם.
    background: |
      הוא בעל תואר שני במדעי המחשב מאוניברסיטת Wright State, דיפלומת המשך בבינה מלאכותית ולמידת מכונה מהמכון הלאומי לטכנולוגיה (NIT) בוורנגל, ותואר ראשון בהנדסת אלקטרוניקה ותקשורת מ-JNTUK. לפני הצטרפותו למעבדה, פיתח יסוואנת' מערכות אינטליגנטיות ואינטראקטיביות כמפתח בחברת Tata Consultancy Services (TCS), תוך עבודה על פני תחומים רבים של AI ומחשוב מרחבי.
  atakilti-brhanu-kiros:
    name: "אטקילטי ברהאנו קירוס"
    description: "חוקר דוקטורט"
    bio: |
      אטקילטי ברהאנו קירוס הוא דוקטורנט בהנדסה אזרחית באוניברסיטת אריאל, המתמחה ב-GeoAI, מדעי הנתונים הגאו-מרחביים ומערכות ניידות חכמות. מחקרו בוחן כיצד נתונים עירוניים רב-אופניים, למידת מכונה, תצפית כדור הארץ ותאומים דיגיטליים עירוניים יכולים לתמוך בחיזוי ניידות הולכי רגל, ניתוח נגישות ותכנון עירוני מבוסס-ראיות.

      מחקר הדוקטורט שלו מתמקד בפיתוח מודלי GeoAI ניתנים להעברה וברי-הסבר לחיזוי פעילות הולכי רגל בערים בעלות מבנים עירוניים, אקלימים, רשתות חיישנים ורמות זמינות נתונים שונות. עבודתו משלבת תצפיות חיישני הולכי רגל עם מורפולוגיה עירונית, רשתות תחבורה, נגישות, מדדים סוציו-אקונומיים, מזג אוויר, חישה מרחוק ומידע גאו-מרחבי נוסף.

      אטקילטי תורם לפרויקט METROPOLIS — תאום דיגיטלי עירוני — במעבדת המחקר לבינה מלאכותית אדריכלית. עבודתו בוחנת חיזוי הולכי רגל מבוסס-תרחישים בתנאי צמיחה עירונית ושינוי אקלים, וכן פיתוח כלים דיגיטליים ניתנים לפרשנות עבור חוקרים, מתכנני ערים, רשויות מוניציפליות ומקבלי החלטות.

      לפני תחילת לימודי הדוקטורט שלו, עבד אטקילטי כמרצה, חוקר ומנהיג אקדמי במדעי המחשב וטכנולוגיית המידע באוניברסיטת מקלה, אתיופיה. תחומי העניין הרחבים שלו כוללים למידת מכונה מרחבית-זמנית, AI ניתן להסבר, מיזוג נתונים גאו-מרחביים רב-אופניים, ניידות מכלילה, ובינה מלאכותית עירונית אחראית.
