  about_title: "אודות המעבדה"
  about_body: "AAIRL (המעבדה למחקר בינה מלאכותית אדריכלית) היא יחידת מחקר בבית הספר לארכיטקטורה של אוניברסיטת אריאל, בהובלת ד\"ר יונתן דורטהיימר. המעבדה מפתחת שיטות חישוביות לעיצוב אדריכלי, ניתוח עירוני ותכנון השתתפותי, בשילוב למידת מכונה, אינטראקציה בין אדם למחשב ומחקר עירוני."

  program_heading: "למי מתאים"
  program_focus: "התואר"
  program_intro: "התכנית נמשכת שנתיים של מחקר לתזה, ומתאימה גם ללימודים חלקיים — כך שניתן לשלב אותה עם עבודה או מחויבויות אחרות. המעבדה מקבלת סטודנטים לתואר שני במסלול תזה בלבד — מסלול המתאים במיוחד למי ששוקלים המשך לדוקטורט או מעוניינים בהכשרה מחקרית רצינית, מעשית, המבוססת על נתונים אמיתיים ושאלות מחקר הקשורות לפרויקטים הפעילים של המעבדה ולשותפיה."
  program_points:
    - "משך הלימודים: שנתיים, מחקר לתזה"
    - "התוכנית לתואר שני בארכיטקטורה פתוחה לבוגרי אדריכלות, וכן לבוגרי תכנון עירוני, הנדסה, מדעי המחשב או תחום קרוב, בכפוף להשלמות"
    - "בהתאם לנושא המחקר, ניתן להיות מלווים גם בהנחיה משותפת עם סגל מפקולטות או מחלקות רלוונטיות נוספות באוניברסיטה — כגון הנדסה אזרחית, הנדסת תעשייה וניהול, או בריאות הציבור"
    - "מסלול תזה בלבד — התכנית אינה כוללת מסלול פרויקט גמר ללא תזה"
    - "הנחיה צמודה במסגרת פרויקט מחקר פעיל וממומן"

