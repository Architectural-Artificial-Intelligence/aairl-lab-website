    intro: "אנחנו מקבלים סטודנטים וסטודנטיות לתואר שני במסלול תזה בלבד — מסלול המתאים במיוחד למי ששוקלים המשך לדוקטורט או מעוניינים בהכשרה מחקרית רצינית. במעבדה עובדים באופן מעשי על מערכי נתונים אמיתיים ועל שאלות מחקר הקשורות ישירות לפרויקטים הפעילים ולשותפינו."
