  apply_heading: "איך מגישים"
  apply_focus: "מועמדות"
  apply_steps:
    - "ודאו שאתם עומדים בדרישות הקבלה הכלליות לתואר שני, כפי שמפורט באתר [לימודי M.Sc. בבית הספר לארכיטקטורה של אוניברסיטת אריאל](https://www.ariel.ac.il/wp/architecture/m-d/)"
    - "עברו על כיווני המחקר והפרויקטים של המעבדה לצורך התמצאות — אין צורך ברעיון סגור לתזה מראש, נשמח לעזור לכם לגבש אחד יחד"
    - "שלחו מייל לד\"ר יונתן דורטהיימר או לד\"ר חיה ברמה עם קורות חיים וגיליון ציונים, בנושא \"Master's Thesis Application\""
    - "במייל, ציינו את תוכנית הלימודים והשנה, נושאים מעניינים (אם יש), כישורים רלוונטיים וזמינות שבועית"

  faq:
    - q: "למי מתאים מסלול התואר השני הזה?"
      a: "התוכנית לתואר שני בארכיטקטורה פתוחה לבוגרי אדריכלות, וכן לבוגרי תכנון עירוני, הנדסה, מדעי המחשב או תחום קרוב, בכפוף להשלמות — במיוחד למי ששוקלים בהמשך דוקטורט או מעוניינים בניסיון מחקרי מעשי בצומת שבין בינה מלאכותית לסביבה הבנויה."
    - q: "כמה זמן נמשכים הלימודים?"
      a: "שנתיים של מחקר לתזה."
    - q: "האם יש מסלול ללא תזה (פרויקט גמר)?"
      a: "לא. מעבדת AAIRL מקבלת סטודנטים לתואר שני במסלול תזה בלבד, הכולל פרויקט מחקר מקורי ומודרך."
    - q: "איך מגישים מועמדות?"
      a: "יש לשלוח מייל לד\"ר יונתן דורטהיימר או לד\"ר חיה ברמה עם קורות חיים וגיליון ציונים (בנושא \"Master's Thesis Application\"), ולציין את תוכנית הלימודים והשנה, נושאים מעניינים, כישורים רלוונטיים וזמינות שבועית. אין צורך ברעיון סגור לתזה מראש — נשמח לעזור לכם לגבש אחד. ודאו שאתם עומדים בדרישות הקבלה הכלליות לתואר שני; פירוט בסעיף \"איך מגישים מועמדות\" למעלה."
    - q: "מה עולה התוכנית, והאם קיים מימון?"
      a: "שכר הלימוד נקבע לפי התעריף האחיד הארצי (הנקבע על ידי המועצה להשכלה גבוהה) ללימודי תואר שני באוניברסיטאות בישראל. מלגות מטעם בית הספר ללימודים מתקדמים של האוניברסיטה זמינות לסטודנטים לתואר שני ולדוקטורט כאחד, והמעבדה מציעה מלגות נוספות לסטודנטים המשתתפים בפרויקטי המחקר הפעילים שלה. המעבדה גם מעסיקה לעיתים סטודנטים במשרות מחקר בתשלום כחלק מפרויקטים ממומנים, בכפוף לזמינות."
    - q: "מה קורה אחרי סיום התזה?"
      a: "סטודנטים רבים ממשיכים לדוקטורט — כולל המשך מחקר במעבדת AAIRL עצמה, שמארחת גם חוקרי פוסט-דוקטורט — ואחרים פונים לתפקידים בעיצוב חישובי, אורבן-טק או תכנון מבוסס-נתונים."

  cta_title: "מתעניינים לשמוע עוד פרטים?"
  cta_body: "אם תואר שני מחקרי המבוסס על פרויקטים ושותפים אמיתיים נשמע לכם מתאים, נשמח לשמוע מכם."
  cta_contact: "צרו קשר"

