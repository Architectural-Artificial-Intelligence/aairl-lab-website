    body: |
      **במעבדה משרות דוקטורט הממומנות במסגרת פרויקטי מחקר.** להבעת עניין, יש לשלוח מייל ל[ד"ר חיה ברמה](mailto:hayab@ariel.ac.il) בנושא "PhD inquiry", הכולל:

      * קורות חיים
      * גיליונות ציונים
      * פסקה קצרה המתארת את תחומי העניין שלכם ואת הניסיון הרלוונטי
      * (אופציונלי) דוגמת כתיבה, תיק עבודות, פרופיל GitHub או תזה קודמת

      פרטים נוספים זמינים ב[אתר הדוקטורט של אוניברסיטת אריאל](https://www.ariel.ac.il/wp/graduate-school/en/applicants/).
  master:
