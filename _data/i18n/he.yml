  testimonials:
    - quote: "אני עובדת במעבדת המחקר aairl כבר מעל לשנתיים, ובמהלך התקופה הזו למדתי המון, מבחינה אקדמית וגם דרך העבודה המשותפת עם חברי המעבדה. העבודה במעבדה פתחה בפניי הזדמנויות להשתתף בכנסים ואירועים מעניינים בארץ ובעולם, להיחשף לעולמות של מחקר, כתיבה ופרסום אקדמי. המעבדה מעודדת מאוד סקרנות, חשיבה עצמאית ועשייה מחקרית ברמה גבוהה. יש הרבה עידוד ליזום רעיונות, לפתח אותם למחקרים ומאמרים ולהגיש אותם לכתבי עת מובילים ולכנסים בינלאומיים."
