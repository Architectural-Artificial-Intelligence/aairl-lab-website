    intro: "אנחנו מזמינים מועמדים ומועמדות לדוקטורט המעוניינים לבצע מחקר מדעי בצומת שבין בינה מלאכותית לפרקטיקת האדריכלות והתכנון העירוני — מחקר המעוגן בעיות מהשטח ובשיתוף פעולה עם ארגונים שונים."
    about:
      - "גיבוש סדר יום מחקרי סביב בעיה אמיתית בתכנון ובעיצוב"
      - "פיתוח שיטות וכלים ואימותם באופן אמפירי"
      - "עבודה עם נתונים מהשטח, לרוב תוך משוב שוטף מהשותפים"
      - "פרסום מאמרים לאורך כל הדוקטורט, פעמים רבות כמחברים ראשיים"
      - "תרומה לתשתיות המעבדה בהתאם לצורך (מאגרי נתונים, אמות מידה להשוואה, כלים)"
      - "משרה במימון מלא, במסגרת פרויקט מחקר"
    look:
      - "מוטיבציה גבוהה למחקר ולכתיבה"
      - "יכולת כמותית או חישובית (למידת מכונה, סטטיסטיקה, סימולציה, אופטימיזציה — כל שילוב מתאים)"
      - "יכולת לעבוד באופן עצמאי תוך שיתוף פעולה הדוק עם הצוות"
      - "מוזמנים מועמדים ומועמדות מרקע של אדריכלות, מדעי המחשב, הנדסה, לימודים עירוניים ותחומים קרובים"
    body: |
      **במעבדה משרות דוקטורט הממומנות במסגרת פרויקטי מחקר.** להבעת עניין, יש לשלוח מייל ל[ד"ר חיה ברמה](mailto:hayab@ariel.ac.il) בנושא "PhD inquiry", הכולל:

      * קורות חיים
      * גיליונות ציונים
      * פסקה קצרה המתארת את תחומי העניין שלכם ואת הניסיון הרלוונטי
      * (אופציונלי) דוגמת כתיבה, תיק עבודות, פרופיל GitHub או תזה קודמת

      פרטים נוספים זמינים ב[אתר הדוקטורט של אוניברסיטת אריאל](https://www.ariel.ac.il/wp/graduate-school/en/applicants/).
  master:
