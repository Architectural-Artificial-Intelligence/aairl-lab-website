      - "משרה במימון מלא, במסגרת פרויקט מחקר"
    look:
      - "מוטיבציה גבוהה למחקר ולכתיבה"
      - "יכולת כמותית או חישובית (למידת מכונה, סטטיסטיקה, סימולציה, אופטימיזציה — כל שילוב מתאים)"
      - "יכולת לעבוד באופן עצמאי תוך שיתוף פעולה הדוק עם הצוות"
