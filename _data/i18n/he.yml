      - "יכולת לעבוד באופן עצמאי לצד הנחיה צמודה"
      - "כישורים רלוונטיים בעיצוב, תכנון, ניתוח נתונים, תכנות או כלים מרחביים"
      - "זמינות לעבודת תזה מתמשכת במסגרת פרויקט פעיל של המעבדה"
    body: |
      יש לשלוח מייל ל[ד"ר חיה ברמה](mailto:hayab@ariel.ac.il), בצירוף קורות חיים וגיליונות ציונים, בנושא "Master's Thesis Application".
      בגוף המייל יש לכלול:

