  stasis-mukwenya:
    name: "סטסיס מוקוונייה"
    description: "חוקר דוקטורט"
    bio: |
      סטסיס מוקוונייה הוא דוקטורנט בהנדסה אזרחית באוניברסיטת אריאל, המתמחה במדעי הנתונים הגאו-מרחביים העירוניים, אינטרופרביליות סמנטית ותאומים דיגיטליים עירוניים ממוקדי-אדם. מחקרו בוחן כיצד מודלים תחומיים עירוניים, הנבנים ופועלים בנפרד עבור אנרגיה, אקלים, ניידות וצורה עירונית, יכולים לחלוק משמעות ולא רק נתונים, ובכך לחזות בדייקנות רבה יותר.

      מחקר הדוקטורט שלו מפתח אונטולוגיות לתאומים דיגיטליים עירוניים קוגניטיביים — מבנים סמנטיים משותפים שדרכם מודלים שנבנו באופן עצמאי מחליפים מידע מוקלד ומעוגן פיזית בזמן ההסקה, ללא צורך באימון מחדש. העבודה מציגה מדדים למידת השלמות של שפה משותפת כזו, תוך הפרדה בין מה שתאום יכול לכנות לבין מה שהוא יכול לקשר, ובוחנת אותם על חיזוי תנועת הולכי רגל בתנאים עירוניים שגרתיים וקיצוניים כאחד, שבהם מודלים המסתמכים אך ורק על מגמות היסטוריות אמינים פחות.

      סטסיס תורם לפרויקט METROPOLIS — תאום דיגיטלי עירוני — במעבדת המחקר לבינה מלאכותית אדריכלית, פלטפורמה שבה מתכננים מריצים סימולציות מול מודל משותף של עיר, בוחנים פיתוחים מוצעים כתרחישים נפרדים, ומשווים בין התוצאות לפני קבלת החלטה. הוא עוסק בתשתית שמתחת לכך: כיצד נתוני עיר מאוחסנים ומאורגנים, כיצד מודלי סימולציה מסופקים במה שהם זקוקים לו, וכיצד מקורות נתונים ומודלים חדשים מתווספים מבלי לבנות מחדש את המערכת.

      לפני תחילת לימודי הדוקטורט שלו, השלים סטסיס תואר ראשון בהנדסת אלקטרוניקה ותקשורת ותואר שני במכטרוניקה ובינה מלאכותית. תחומי העניין הרחבים שלו כוללים ייצוג ידע, למידת מכונה מונחית-פיזיקה, הסקה חוצת-תחומים, ניידות מכלילה, ובינה מלאכותית עירונית אחראית.
    research_focus: |
