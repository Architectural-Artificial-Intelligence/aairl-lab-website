  doron-greenberg:
    name: "דורון גרינברג"
    bio: |
      ד"ר דורון גרינברג בעל תואר דוקטור (Ph.D.) בכלכלה מאוניברסיטת יוסטון. הוא שימש בעבר כמרצה בכיר בחוג לכלכלה ומנהל עסקים באוניברסיטת אריאל, שם הוא ממשיך לפעול כיום כעמית מחקר. מרצה מנוסה בתחומי הכלכלה והמימון, פרסם עשרות מאמרי מחקר אקדמיים לצד טורי דעה בנושאי פיננסים אישיים ועושר ציבורי בתקשורת המקומית.

      תחום המחקר המרכזי שלו הוא כלכלה והתנהגות פיננסית (Behavioral Economics and Finance). הוא מונה למנהל המייסד של הסניף הישראלי של הקולג' של איגוד אנשי הסיכון הגלובלי (GARP) באוניברסיטת אריאל. החל משנת 2024 מחקרו במעבדת AAIRL מתמקד בהיבטים הכלכליים-התנהגותיים של התחדשות עירונית.
  osher-cohen:
    name: "אושר כהן"
    bio: |
      אושר כהן היא אדריכלית וסטודנטית לתואר שני (M.Sc.) ב-AAIRL. מחקרה עוסק בממשק שבין בינה מלאכותית, עיצוב עירוני וחוויית האדם במרחב הציבורי.

      עבודתה הנוכחית בוחנת כיצד ניתן להשתמש בשיטות מבוססות בינה מלאכותית להערכת סביבות עירוניות ולזיהוי איכויות מרחביות התומכות באינטראקציה אנושית ובמפגשים משמעותיים, במיוחד בהקשר של חיי היומיום המתווכים יותר ויותר על ידי טכנולוגיה.
  hanan-peretz:
    name: "חנן פרץ"
    bio: |
      ד"ר חנן פרץ הוא אדריכל, חוקר ומרצה, חבר סגל באוניברסיטת אריאל ומרכז את הסטודיויים התכנוניים של שנה ב'. עבודתו המקצועית כאדריכל משתרעת על פני כל קני המידה ומגוון רחב של סוגי עשייה - מעיצוב פנים, אדריכלות ותכנון תאורה ועד לתכנון עירוני ולעיצוב המרחב הציבורי. בין עבודותיו ערך את מדיניות העיצוב העירוני של שכונת פלורנטין בתל אביב.

      לצד העשייה המקצועית וההוראה, מחקרו עוסק בתאורת רחוב עירונית וביחסים שבין אור, אדריכלות והחוויה של המרחב הציבורי בשעות החשכה, כאשר פלורנטין שימשה מקרה מבחן מרכזי בעבודת הדוקטורט שלו. עבודתו מחברת בין פרקטיקה אדריכלית מגוונת, הוראת תכנון ומחקר, מתוך עניין מתמשך באופן שבו אדריכלות, אור ותכנון מעצבים את המרחב ואת חיי היומיום בעיר.

jobs:
  phd:
    title: "דוקטורט"
    intro: "אנחנו מזמינים מועמדים ומועמדות לדוקטורט המעוניינים לבצע מחקר מדעי בצומת שבין בינה מלאכותית לפרקטיקת האדריכלות והתכנון העירוני — מחקר המעוגן בעיות מהשטח ובשיתוף פעולה עם ארגונים שונים."
    about:
      - "גיבוש סדר יום מחקרי סביב בעיה אמיתית בתכנון ובעיצוב"
      - "פיתוח שיטות וכלים ואימותם באופן אמפירי"
      - "עבודה עם נתונים מהשטח, לרוב תוך משוב שוטף מהשותפים"
