      - "אינטראקציה בין אדם לבינה מלאכותית בכלי עיצוב"
      - "אנליטיקה מרחבית, סימולציה והשוואת ביצועים"
      - "מחקר יישומי בשיתוף גופים ציבוריים ופרטיים"
    body: |
      **למעבדה משרות פוסט-דוקטורט הממומנות במסגרת פרויקטי מחקר.** להגשת מועמדות יש לשלוח קובץ PDF אחד (עד 10MB) ל[ד"ר חיה ברמה](mailto:hayab@ariel.ac.il), בנושא "Postdoctoral application". הקובץ צריך לכלול:

