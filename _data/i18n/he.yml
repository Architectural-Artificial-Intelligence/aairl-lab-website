  projects_intro: "הצצה למה שקורה במעבדה כרגע — רוב עבודות הדוקטורט מתחברות לאחד מהפרויקטים הפעילים הבאים."

  testimonials:
    - quote: "עריכת מחקר במעבדת המחקר לבינה מלאכותית אדריכלית (AAIRL) הייתה חוויה מכוננת ביותר. המעבדה מספקת לא רק גישה למשאבי מחשוב בעלי ביצועים גבוהים, אלא גם חופש אינטלקטואלי להרחיב את גבולות האפשרי. בהנחיית המעבדה, הצלחתי לגשר בין מדעי המחשב לתאוריה אדריכלית, לשתף בפתיחות ברעיונות שלי, ולפתח מסגרות ניסיוניות מהעולם האמיתי. המעבדה מעניקה תמיכה יוצאת דופן, ומדרבנת באופן עקבי את הסטודנטים שלה לקדם את העבודה הטכנית שלהם לכדי תרומות מדעיות משמעותיות. מה שבאמת מייחד את AAIRL היא התרבות שלה: אל החוקרים מתייחסים כשותפים, והם זוכים לתמיכה מלאה בתרגום רעיונות חדשניים לפרסומים ברמה הגבוהה ביותר. המעבדה ליוותה אותי בכל שלב במסע שלי, ואני אסיר תודה עמוקות על ההזדמנות לעבוד בסביבה יוצאת דופן שכזו."
      name: "יסוואנת' אלה"
      role: "סטודנט לדוקטורט ב-AAIRL"
      image: "/images/people/yaswanth-alla.jpeg"
  podcast_cta: "מוזמנים להאזין לפודקאסט של המעבדה"

  partners_heading: "גופי מימון"
  partners_focus: "ושותפים"
  partners_intro: "פרויקטי המעבדה ממומנים ומלווים על ידי קרנות מחקר, משרדי ממשלה ורשויות מקומיות."

  funding_heading: "מימון"
  funding_focus: "ומלגה"
  funding_body: "מלגות מטעם בית הספר ללימודים מתקדמים של האוניברסיטה זמינות לסטודנטים לתואר שני ולדוקטורט כאחד, והמעבדה מציעה מלגות נוספות לסטודנטים המשתתפים בפרויקטי המחקר הפעילים שלה — בנוסף למלגות מחקר מפרויקט הנשענות על המענקים הפעילים של המעבדה ולמלגות דוקטורט תחרותיות ארציות. הסדרי המימון משתנים בהתאם לפרויקט ולרקע המועמד ונקבעים באופן פרטני מול המנחה טרם הקבלה."

  apply_heading: "איך מגישים"
  apply_focus: "מועמדות"
  apply_steps:
    - "ודאו שהרקע שלכם והתואר השני שהשלמתם מתאימים לכיווני המחקר של המעבדה (אדריכלות, תכנון עירוני, הנדסה, מדעי המחשב או תחום קרוב)"
    - "עברו על כיווני המחקר והפרויקטים הפעילים של המעבדה, וגבשו שאלת מחקר ראשונית המתבססת עליהם"
    - "שלחו מייל לד\"ר יונתן דורטהיימר עם קורות חיים, תזת התואר השני (או תקציר שלה) וגיליון ציונים, בנושא \"Ph.D. Application\""
    - "במייל, ציינו את תחומי העניין המחקריים שלכם, כישורים רלוונטיים (למשל תכנות, סטטיסטיקה, GIS, סימולציה) ותאריך התחלה משוער"

  faq:
    - q: "למי מתאים המסלול הזה?"
      a: "לבוגרי תואר שני שהושלם במסלול תזה (או שווה ערך) באדריכלות, תכנון עירוני, הנדסה, מדעי המחשב או תחום קרוב, המעוניינים לבצע מחקר מעמיק במשרה מלאה בצומת שבין בינה מלאכותית לסביבה הבנויה."
    - q: "כמה זמן נמשכים הלימודים?"
      a: "בדרך כלל 3–4 שנים של מחקר במשרה מלאה, בהתאם למתווה המל\"ג ללימודי דוקטורט."
    - q: "האם נדרש תואר שני שהושלם?"
      a: "כן, כמעט בכל המקרים — נדרש תואר שני שהושלם במסלול תזה (או שווה ערך) עם רקע אקדמי חזק. אם אין לכם תואר כזה אך יש לכם רקע אקדמי יוצא דופן, פנו אלינו כדי לבדוק אפשרות למסלול חלופי."
    - q: "באיזו מחלקה אירשם?"
      a: "מעבדת AAIRL פועלת בבית הספר לארכיטקטורה. מועמדי דוקטורט נרשמים דרך בית הספר ללימודים מתקדמים ובית הספר לארכיטקטורה של אוניברסיטת אריאל, עם אפשרות לשיתוף פעולה עם הפקולטה להנדסה (הנדסת תעשייה וניהול או הנדסה אזרחית). מסלול הרישום המדויק שלכם נקבע מול בית הספר ללימודים מתקדמים טרם הקבלה."
    - q: "האם ניתן לבסס את הדיסרטציה על מאמרים שפורסמו?"
      a: "כן — דיסרטציות מצטברות המבוססות על מאמרים נפוצות במעבדה, וניתן לתאם זאת מול בית הספר ללימודים מתקדמים של האוניברסיטה."
    - q: "איך מגישים מועמדות?"
      a: "יש לשלוח מייל לד\"ר יונתן דורטהיימר עם קורות חיים, תזת התואר השני (או תקציר שלה) וגיליון ציונים (בנושא \"Ph.D. Application\"), ולציין תחומי עניין מחקריים, כישורים רלוונטיים ותאריך התחלה משוער. פירוט בסעיף \"איך מגישים מועמדות\" למעלה."
    - q: "האם קיים מימון?"
      a: "מלגות מטעם בית הספר ללימודים מתקדמים של האוניברסיטה זמינות לסטודנטים לתואר שני ולדוקטורט כאחד, והמעבדה מציעה מלגות נוספות לסטודנטים המשתתפים בפרויקטי המחקר הפעילים שלה — בנוסף למלגות מחקר מפרויקט הנשענות על המענקים הפעילים של המעבדה ולמלגות דוקטורט תחרותיות ארציות. הסדרי המימון משתנים בהתאם לפרויקט ולרקע המועמד ונקבעים באופן פרטני מול המנחה טרם הקבלה."
  cta_title: "מתעניינים לשמוע עוד פרטים על מחקר הדוקטורט?"
  cta_body: "אם מחקר מעמיק במשרה מלאה, המבוסס על פרויקטים ושותפים אמיתיים, נשמע לכם מתאים, נשמח לשמוע מכם."
  cta_contact: "צרו קשר"
